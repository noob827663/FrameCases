openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Framecase product catalog operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Fetch the Framecase catalog
      description: Fetches the latest phone case designs from the configured PhoneVilla collections.
      parameters:
        - name: collection
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 48
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 1
      responses:
        "200":
          description: Catalog products and sync information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "502":
          description: Source catalog unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CatalogProduct:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        price:
          type: string
        compareAtPrice:
          type: ["string", "null"]
        productUrl:
          type: string
        collectionSlug:
          type: string
        collectionName:
          type: string
        tags:
          type: array
          items:
            type: string
        isFeatured:
          type: boolean
      required:
        - id
        - title
        - description
        - imageUrl
        - price
        - compareAtPrice
        - productUrl
        - collectionSlug
        - collectionName
        - tags
        - isFeatured
    CatalogCollection:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        count:
          type: integer
      required:
        - slug
        - name
        - count
    CatalogResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCollection"
        syncedAt:
          type: string
          format: date-time
        sourceOnline:
          type: boolean
        page:
          type: integer
        hasNextPage:
          type: boolean
      required:
        - products
        - collections
        - syncedAt
        - sourceOnline
        - page
        - hasNextPage
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
